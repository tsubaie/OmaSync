name: Release

# Push a tag like v0.2.0 to build the Omarchy (Arch) package and publish a GitHub Release,
# which install.sh downloads. A manual run builds the package without publishing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# Read-only by default; only the publishing job asks for more.
permissions:
  contents: read

jobs:
  validate:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          grep -qx "version = \"$version\"" src-tauri/Cargo.toml || { echo "src-tauri/Cargo.toml has another version than package.json ($version)" >&2; exit 1; }
          grep -q "\"version\": \"$version\"" src-tauri/tauri.conf.json || { echo "src-tauri/tauri.conf.json has another version than package.json ($version)" >&2; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  arch:
    name: Omarchy package
    runs-on: ubuntu-latest
    needs: validate
    container: archlinux:base-devel
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Tauri's build dependencies
        run: pacman -Syu --noconfirm webkit2gtk-4.1 gtk3 git sudo
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Built here with the caches; makepkg refuses to run as root and would start over in its
      # own cargo home, so it only packages (-R). -d: cargo, node and pnpm come from the actions,
      # not pacman, so the makedepends check is skipped.
      - name: Build
        run: pnpm install --frozen-lockfile && pnpm build && cargo build --release --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      # Without tauri/custom-protocol the binary opens the Vite dev address instead of the
      # embedded page and shows a white window (v0.1.0 shipped that way). The page's hashed asset
      # paths are only in the binary when it's embedded.
      - name: The page is embedded, not the dev server
        run: grep -aq '/assets/index-' src-tauri/target/release/omarchy-sync
      - name: Package
        run: |
          useradd -m builder
          chown -R builder .
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          (cd packaging/arch && sudo -u builder makepkg -Rfd --noconfirm)
          # The same files as a plain tarball, which the AUR recipe (omarchy-sync-bin) installs from.
          dir="omarchy-sync-$VERSION"
          mkdir -p "release/$dir/icons"
          cp src-tauri/target/release/omarchy-sync omarchy-sync.desktop LICENSE "release/$dir/"
          cp -r packaging/icons/. "release/$dir/icons/"
          tar -C release -czf "release/$dir-x86_64-linux.tar.gz" "$dir" && rm -r "release/$dir"
          cp packaging/arch/*.pkg.tar.zst release/
          sha="$(sha256sum "release/$dir-x86_64-linux.tar.gz" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$sha/" packaging/aur/omarchy-sync-bin/PKGBUILD > release/PKGBUILD
          cd release && sha256sum ./*.pkg.tar.zst ./*.tar.gz PKGBUILD | sed 's|\./||' > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: release/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The SSH key of the AUR account that owns omarchy-sync-bin. Until it's set, the AUR step
      # is skipped and the recipe is only attached to the release.
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: release
      - run: cd release && sha256sum -c SHA256SUMS
      - name: Build provenance for the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.pkg.tar.zst
            release/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
      # The first push creates the AUR package; later ones update it. .SRCINFO is generated there.
      - name: Publish to the AUR
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: omarchy-sync-bin
          pkgbuild: release/PKGBUILD
          commit_username: tsubaie
          commit_email: t.subaie@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.validate.outputs.version }}
