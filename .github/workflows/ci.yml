name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the same checks, with many more random-order sync runs (see CONTRIBUTING.md).
  schedule:
    - cron: '0 3 * * *'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The same gates a contributor runs locally (`pnpm audit:all`), split so they run in parallel:
# the page's static checks and unit tests, the Rust engine, and the page in a real browser.
jobs:
  static:
    name: Lint, types, format, unused code, layering, unit tests
    runs-on: ubuntu-latest
    # A hung download (an apt mirror, say) fails the run instead of holding it for 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:static
      - run: pnpm test:coverage

  # Two runs of one job, side by side: the format, Clippy and unit tests, and the sync
  # scenarios (about a minute on their own, one at a time). Both build the same test binary
  # from a shared cache.
  rust:
    name: Rust ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [checks, scenarios]
    steps:
      - uses: actions/checkout@v5
      - name: Tauri's Linux build dependencies
        timeout-minutes: 5
        # A mirror that stops answering is retried instead of waited on.
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update
          sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: chezmoi, for the sync scenarios
        if: matrix.part == 'scenarios'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tests
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Tauri embeds the built page, so it has to exist before the Rust crate compiles.
      - run: pnpm install --frozen-lockfile && pnpm build
      - if: matrix.part == 'checks'
        run: pnpm rust:fmt && pnpm rust:clippy && pnpm rust:test -- --skip sync::scenarios
      - if: matrix.part == 'scenarios'
        run: pnpm rust:test sync::scenarios
        env:
          LAB_SEEDS: ${{ github.event_name == 'schedule' && 60 || 3 }}
          LAB_STEPS: ${{ github.event_name == 'schedule' && 20 || 12 }}

  e2e:
    name: The page in WebKit, with accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The WebKit download (most of a minute) is kept between runs; its system libraries are
      # still installed each time.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
